<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Clip Compiler · Review</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#121619;color:#edf0ed}body{max-width:1160px;margin:auto;padding:28px}h1{font-size:28px;margin-bottom:5px}.muted{color:#a6b4b9}button,select,input{font:inherit;background:#263138;color:inherit;border:1px solid #536169;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#365347}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}.layout{display:grid;grid-template-columns:340px 1fr;gap:25px}#list{max-height:72vh;overflow:auto}#list button{display:block;text-align:left;width:100%;margin:6px 0}video{width:100%;background:#000;max-height:420px}article{background:#1b2328;padding:20px;border-radius:12px}.badge{font-size:13px;color:#9ee2c0}label{display:inline-block;margin:8px 10px 8px 0}input{width:100px}#notice{white-space:pre-wrap;color:#f8da97}#reason{line-height:1.5;white-space:pre-wrap}@media(max-width:750px){.layout{grid-template-columns:1fr}#list{max-height:260px}}
</style>
<h1>Auto Clip Compiler</h1><div class="muted">Your moments, with the setup and reaction intact.</div>
<div class="bar"><select id="filter"><option value="all">All moments</option><option value="keep">Keep</option><option value="maybe">Uncertain</option><option value="reject">Rejected</option><option value="failed">Failed sources</option></select><span id="summary"></span><button id="render">Render saved selection</button></div>
<p id="notice" role="status"></p><div class="layout"><nav id="list" aria-label="Moments"></nav><article><h2 id="title">Choose a moment</h2><video id="video" controls preload="metadata"></video><p id="reason"></p><div id="editor" hidden><label>In (seconds) <input id="start" type="number" min="0" step="0.1"></label><label>Out (seconds) <input id="end" type="number" min="0" step="0.1"></label><div class="bar"><button id="play">Play cut</button><button id="context">Show surrounding context</button><button data-choice="keep">Keep</button><button data-choice="maybe">Maybe</button><button data-choice="reject">Reject</button><button id="save">Save bounds</button></div></div></article></div>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);let data,current,cutEnd=null;
async function api(path,body){const response=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'X-Review-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.detail||value.error||response.statusText);return value}
function notice(text){$('notice').textContent=text}
async function load(){try{data=await api('items');$('summary').textContent=`${data.candidates.length} moments · ${data.summary?.status||'pending'}`;draw()}catch(e){notice(e.message)}}
function source(id){return data.sources.find(s=>s.id===id)}
function name(s){return s.path.split(/[\\/]/).pop()}
function draw(){$('list').replaceChildren();const filter=$('filter').value;const values=filter==='failed'?data.sources.filter(s=>s.status!=='complete'):data.candidates.filter(c=>filter==='all'||c.recommendation===filter);for(const item of values){const failed=filter==='failed',s=failed?item:source(item.source);const b=document.createElement('button');b.textContent=failed?`${name(s)} · ${s.status}`:`${name(s)} · ${item.start.toFixed(1)}–${item.end.toFixed(1)}s · ${item.recommendation}${item.reviewed?' ✓':''}`;b.onclick=()=>show(item,failed);$('list').append(b)}}
function show(item,failed){current=failed?null:item;const s=failed?item:source(item.source);$('title').textContent=name(s);$('editor').hidden=failed;cutEnd=null;$('video').src='/api/preview/'+s.id+'?token='+encodeURIComponent(token);$('reason').textContent=failed?s.error:[item.reason,`Setup: ${item.setup}`,`Payoff: ${item.payoff}`,`Reaction: ${item.reaction}`,`Confidence: ${item.confidence}`].join('\n');if(!failed){$('start').value=item.start.toFixed(3);$('end').value=item.end.toFixed(3);$('video').onloadedmetadata=()=>{$('video').currentTime=Math.max(0,item.start-4)}}notice('')}
async function save(choice){if(!current)return;try{await api('override/'+current.id,{recommendation:choice||current.recommendation,start:Number($('start').value),end:Number($('end').value)});notice('Saved. Your edits will be used in the next render.');await load();current=data.candidates.find(c=>c.id===current.id)}catch(e){notice(e.message)}}
$('filter').onchange=draw;$('save').onclick=()=>save();document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>save(b.dataset.choice));
$('play').onclick=()=>{cutEnd=Number($('end').value);$('video').currentTime=Number($('start').value);$('video').play()};$('context').onclick=()=>{cutEnd=null;$('video').currentTime=Math.max(0,Number($('start').value)-10);$('video').play()};$('video').ontimeupdate=()=>{if(cutEnd!==null&&$('video').currentTime>=cutEnd){$('video').pause();cutEnd=null}};
$('render').onclick=async()=>{$('render').disabled=true;notice('Rendering saved choices…');try{notice('Saved to '+(await api('render',{})).output)}catch(e){notice(e.message)}finally{$('render').disabled=false}};
load();
</script></html>
